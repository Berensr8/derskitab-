<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF İnceleyici</title>
<style>
  :root {
    --zemin: #f4f5f7; --kart: #ffffff; --cizgi: #dde1e6; --yazi: #1d2330; --soluk: #5d6675;
    --paragraf: #1f9d55; --kisa: #2f6fdb; --bozuk: #d63c3c; --simge: #8a9099;
    --tespit: #f08c00; --cumle1: #ffd84d; --cumle2: #7cd3ff; --vurgu: #6c47ff; --celiski: #9b2fae;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Segoe UI", Arial, sans-serif; color: var(--yazi);
         background: var(--zemin); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--kart); border-bottom: 1px solid var(--cizgi); padding: 10px 16px;
           display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  .cip { background: var(--zemin); border: 1px solid var(--cizgi); border-radius: 999px;
         padding: 2px 10px; font-size: 12.5px; white-space: nowrap; }
  .cip b { font-weight: 600; }
  button.cip { font: inherit; font-size: 12.5px; color: inherit; cursor: pointer; }
  button.cip:hover { border-color: #2e8b57; }
  #mufredatPanel { background: var(--kart); border-bottom: 1px solid var(--cizgi); padding: 10px 16px;
                   font-size: 13.5px; max-height: 32vh; overflow: auto; }
  #mufredatPanel ul { margin: 6px 0 0; padding-left: 18px; }
  #mufredatPanel li { margin-bottom: 4px; }
  #mufredatPanel .kavram { font-weight: 600; color: #1e7a46; }
  main { flex: 1; display: grid; grid-template-columns: 200px minmax(0, 1fr) 430px; min-height: 0; }
  aside, section { overflow: auto; min-height: 0; }
  #sol { border-right: 1px solid var(--cizgi); background: var(--kart); padding: 12px; }
  #sag { border-left: 1px solid var(--cizgi); background: var(--kart); padding: 14px 16px; }
  #orta { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--soluk);
       margin: 14px 0 6px; }
  h2:first-child { margin-top: 0; }
  .lejant label { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; }
  .kare { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  #sayfaListesi button { display: flex; justify-content: space-between; width: 100%; text-align: left;
       border: 0; background: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
  #sayfaListesi button:hover { background: var(--zemin); }
  #sayfaListesi button.secili { background: #ebe6ff; font-weight: 600; }
  .rozet { background: #b35f00; color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; }
  .rozet.yazim { background: var(--bozuk); }
  .rozetler { display: flex; gap: 3px; }
  .yazimCizgi { fill: var(--bozuk); pointer-events: none; }
  .yazimZemin { fill: var(--bozuk); opacity: .14; pointer-events: none; }
  .yazimKart { border-color: var(--bozuk); background: #fff1f1; }
  .yazimKart.dusuk { opacity: .62; border-style: dashed; }
  .parca { font-family: ui-monospace, Consolas, monospace; background: #ffd9d9; border-radius: 4px; padding: 0 4px; }
  .arac { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .arac button { border: 1px solid var(--cizgi); background: var(--kart); border-radius: 6px;
                 padding: 4px 10px; cursor: pointer; font: inherit; }
  .arac button:hover { border-color: var(--vurgu); }
  #sayfaKutusu { overflow: auto; flex: 1; }
  svg#sayfa { display: block; margin: 0 auto; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
  .blok { cursor: pointer; fill-opacity: .07; stroke-width: 1.2; transition: fill-opacity .1s; }
  .blok:hover { fill-opacity: .28; stroke-width: 2.4; }
  .blok.secili { fill-opacity: .12; stroke-width: 3; stroke: var(--vurgu) !important; }
  .soluk .blok:not(.secili) { opacity: .35; }
  .tespitCerceve { fill: none; stroke: var(--tespit); stroke-width: 3; stroke-dasharray: 7 4; pointer-events: none; }
  .cumleKutu { pointer-events: none; opacity: .38; }
  .cumleKutu.parlak { opacity: .8; stroke: var(--yazi); stroke-width: .8; }
  .ipucu { color: var(--soluk); }
  .kart { border: 1px solid var(--cizgi); border-radius: 10px; padding: 12px; margin: 10px 0; }
  .baslik { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tur { color: #fff; border-radius: 6px; padding: 1px 8px; font-weight: 600; font-size: 12.5px; }
  .uyari { border-color: var(--tespit); background: #fff6e8; }
  .cumle { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 8px 6px;
           border-radius: 8px; cursor: default; }
  .cumle:hover { background: var(--zemin); }
  .no { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
        font-size: 12px; font-weight: 700; }
  .kelimeler { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .kelime { border-radius: 5px; padding: 0 5px; font-size: 12.5px; border: 1px solid transparent; }
  .kelime sup { font-size: 10px; font-weight: 700; margin-left: 2px; }
  .h1 { background: #eef0f3; } .h3 { background: #e3f1ff; } .h5 { background: #ffe9c7; }
  .h6 { background: #ffd3d3; border-color: #f2a3a3; }
  .adim { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: var(--zemin);
          border-radius: 6px; padding: 6px 8px; margin: 4px 0; overflow-x: auto; }
  .formul { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; }
  .formul .deger { font-size: 22px; font-weight: 700; }
  .cubuk { grid-column: 1 / -1; position: relative; height: 8px; border-radius: 4px; margin: 6px 0 2px;
           background: linear-gradient(90deg, #d63c3c, #f0c000, #1f9d55); }
  .cubuk.ters { background: linear-gradient(90deg, #1f9d55, #f0c000, #d63c3c); }
  .isaret { position: absolute; top: -4px; width: 4px; height: 16px; background: var(--yazi); border-radius: 2px; }
  .ortanca { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--soluk); opacity: .8; }
  .kucuk { font-size: 12px; color: var(--soluk); }
  #blokListesi div { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 6px;
       cursor: pointer; }
  #blokListesi div:hover { background: var(--zemin); }
  #blokListesi div.secili { background: #ebe6ff; }
  #blokListesi .kare { position: relative; top: 1px; }
  #blokListesi span.m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .yazimZemin.tiklanir { pointer-events: auto; cursor: pointer; }
  .yazimZemin.tiklanir:hover { opacity: .35; }
  .sekmeler { display: flex; gap: 4px; margin: 12px 0 4px; border-bottom: 1px solid var(--cizgi); }
  .sekmeler button { border: 0; background: none; font: inherit; padding: 6px 12px; cursor: pointer;
       border-bottom: 3px solid transparent; color: var(--soluk); }
  .sekmeler button.secili { border-color: var(--vurgu); color: var(--yazi); font-weight: 600; }
  .adimBaslik { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 6px; }
  .adimNo { width: 22px; height: 22px; border-radius: 50%; background: var(--vurgu); color: #fff;
       display: grid; place-items: center; font-size: 12px; flex: none; }
  .olcum { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 13px; }
  .tamam { color: var(--paragraf); font-weight: 600; } .olumsuz { color: var(--bozuk); font-weight: 600; }
  .yk { border-radius: 5px; padding: 1px 6px; font-size: 13px; border: 1px solid transparent; cursor: default; }
  .yk:hover, .yk.odak { outline: 2px solid var(--vurgu); }
  .yk.gecerli { background: #e4f4e9; } .yk.supheli { background: #fff0b8; border-color: #e0b400; }
  .yk.hata { background: #ffd3d3; border-color: var(--bozuk); font-weight: 700; }
  .yk.atlandi { background: #eceef1; color: var(--soluk); border: 1px dashed #b4bac3; }
  .yk.terim { background: #ece6ff; border-color: #9a80ff; } .yk.okuma { background: #dceaff; border-color: #6e9be6; }
  .ykLejant { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 6px 0; font-size: 12px; }
  #kelimeBilgi { min-height: 64px; font-size: 13px; background: var(--zemin); border-radius: 8px;
       padding: 8px 10px; margin-top: 8px; }
  .kurallar { width: 100%; border-collapse: collapse; font-size: 13px; }
  .kurallar td { padding: 4px 4px; border-top: 1px solid var(--cizgi); vertical-align: top; }
  .kurallar td:first-child { font-weight: 700; color: var(--soluk); width: 30px; }
  .kurallar td:last-child { text-align: right; white-space: nowrap; }
  .kelimeIz { fill-opacity: .08; stroke-width: 1.4; pointer-events: none; }
  .kelimeIz.parlak { stroke-width: 3; fill-opacity: .3; }
  .akis { margin: 6px 0 0 18px; padding: 0; } .akis li { margin: 3px 0; }
  .rozet.celiski { background: var(--celiski); }
  .testBandi { background: #fff4d6; border-bottom: 2px solid #e0b400; padding: 8px 16px; font-size: 13.5px; }
  .eklendi { background: #fff0b8; border-radius: 999px; padding: 0 7px; font-size: 11.5px; color: #6b5200; }
  .celiskiKutu { fill: var(--celiski); fill-opacity: .16; stroke: var(--celiski); stroke-width: 1.2;
       stroke-dasharray: 4 2; cursor: pointer; }
  .celiskiKutu:hover, .celiskiKutu.parlak { fill-opacity: .32; stroke-width: 2.2; }
  .celiskiKart { border-color: var(--celiski); background: #fbf2fd; }
  .ikiCumle { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 8px 0; }
  .alinti { border-left: 4px solid var(--celiski); background: var(--kart); border-radius: 6px;
       padding: 6px 9px; font-size: 13px; }
  .alinti .kucuk { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 2px; }
  .alinti button { border: 1px solid var(--celiski); color: var(--celiski); background: none; border-radius: 6px;
       padding: 1px 8px; cursor: pointer; font: inherit; font-size: 12px; }
  .oy { display: grid; grid-template-columns: 130px 1fr; gap: 2px 8px; font-size: 13px; margin: 4px 0; }
  .oy .gerekce { grid-column: 2; color: var(--soluk); font-size: 12.5px; }
  .karsi { display: grid; grid-template-columns: 44px 1fr auto; gap: 6px; align-items: start; font-size: 12.5px;
       padding: 5px 4px; border-top: 1px solid var(--cizgi); }
  .karsi .bz { font-family: ui-monospace, Consolas, monospace; color: var(--soluk); }
  .etiket { border-radius: 999px; padding: 0 7px; font-size: 11.5px; white-space: nowrap; }
  .etiket.uyumlu { background: #e4f4e9; } .etiket.ilgisiz { background: #eceef1; }
  .etiket.celiski { background: #f3dcf7; color: var(--celiski); font-weight: 600; }
  .etiket.elendi { background: #fff0b8; }
</style>
</head>
<body>
<header>
  <h1 id="kitapAdi">PDF İnceleyici</h1>
  <div id="ozet" style="display:flex;gap:6px;flex-wrap:wrap"></div>
</header>
<main>
  <aside id="sol">
    <h2>Gösterilenler</h2>
    <div class="lejant" id="lejant"></div>
    <label class="lejant" style="display:flex;gap:8px;margin-top:6px;cursor:pointer">
      <input type="checkbox" id="tumCumleler"> Tüm cümleleri renklendir</label>
    <label class="lejant" style="display:flex;gap:8px;cursor:pointer">
      <input type="checkbox" id="yalnizTespitli"> Yalnız tespitli sayfalar</label>
    <h2>Sayfalar</h2>
    <div id="sayfaListesi"></div>
  </aside>
  <section id="orta">
    <div class="arac">
      <button id="onceki">◀ Önceki</button>
      <strong id="sayfaBilgisi"></strong>
      <button id="sonraki">Sonraki ▶</button>
      <span style="flex:1"></span>
      <button id="kucult" aria-label="Küçült">−</button><span id="olcek">100%</span><button id="buyut" aria-label="Büyüt">+</button>
    </div>
    <div class="ipucu kucuk">Bir kutuya tıklayın: ayrıntılar sağda açılır. Klavye: ← → sayfa, Esc seçimi kaldır.</div>
    <div id="sayfaKutusu"></div>
  </section>
  <aside id="sag">
    <div id="ayrinti"></div>
    <h2>Bu sayfadaki bloklar</h2>
    <div id="blokListesi"></div>
  </aside>
</main>
<script>
const VERI = /*__VERI__*/null;

const TURLER = {
  paragraf: { ad: "Paragraf", renk: "var(--paragraf)" },
  kisa: { ad: "Kısa metin", renk: "var(--kisa)" },
  bozuk: { ad: "Bozuk metin", renk: "var(--bozuk)" },
  simge: { ad: "Simge", renk: "var(--simge)" },
};
const CUMLE_RENK = ["var(--cumle1)", "var(--cumle2)"];
const SVGNS = "http://www.w3.org/2000/svg";
const durum = { sayfa: 0, blok: null, olcek: 1, sekme: "okunabilirlik", gorunur: { paragraf: true, kisa: true, bozuk: true, simge: true } };

// --- yardımcılar ---
function el(etiket, ozellik = {}, ...cocuklar) {
  const e = document.createElement(etiket);
  for (const [k, v] of Object.entries(ozellik)) {
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of cocuklar.flat()) if (c != null) e.append(c instanceof Node ? c : String(c));
  return e;
}
function svg(etiket, ozellik = {}) {
  const e = document.createElementNS(SVGNS, etiket);
  for (const [k, v] of Object.entries(ozellik)) e.setAttribute(k, v);
  return e;
}
const sayi = (x, d = 1) => Number(x).toLocaleString("tr-TR", { minimumFractionDigits: d, maximumFractionDigits: d });
const kelimeSayisi = m => m.split(/\s+/).filter(Boolean).length;
const sayfa = () => VERI.sayfalar[durum.sayfa];

// --- üst bilgi ---
function ustBilgi() {
  document.getElementById("kitapAdi").textContent = VERI.kitap;
  if (VERI.test_modu) document.body.insertBefore(el("div", { class: "testBandi" },
    el("b", {}, "🧪 TEST MODU: "),
    `Bu inceleme, sistemi ölçmek için kitaba bilerek ${VERI.test_modu.madde_sayisi} çelişki eklenmiş metinle üretildi `,
    `(${VERI.test_modu.set === "gelistirme" ? "geliştirme" : "test"} seti, K20). Eklenen ya da değiştirilen cümleler sayfa görüntüsünde `,
    el("b", {}, "görünmez"), "; sağ paneldeki Tutarlılık sekmesinde metin olarak ve ", el("span", { class: "eklendi" }, "test için eklendi"),
    " etiketiyle gösterilir. Gerçek kitapta çelişki bulunmadı."), document.body.firstChild);
  const o = VERI.ozet, kutu = document.getElementById("ozet");
  mufredatCipi(kutu);
  if (!o) { kutu.append(el("span", { class: "cip" }, "Okunabilirlik özeti yok")); return; }
  kutu.append(
    el("span", { class: "cip" }, "Hedef: ", el("b", {}, o.hedef_sinif ? o.hedef_sinif + ". sınıf" : "bilinmiyor")),
    el("span", { class: "cip", title: "Kitaptaki tüm paragrafların ortancası" },
       "Ateşman ", el("b", {}, sayi(o.atesman)), " · ", o.atesman_duzeyi),
    el("span", { class: "cip" }, "Çetinkaya-Uzun ", el("b", {}, sayi(o.cetinkaya_uzun)), " · ", o.cetinkaya_uzun_duzeyi),
    el("span", { class: "cip" }, "Bezirci-Yılmaz ", el("b", {}, sayi(o.bezirci_yilmaz)), " · ", o.bezirci_yilmaz_duzeyi),
    el("span", { class: "cip" }, "Okunabilirlik tespiti: ", el("b", {}, VERI.toplam_tespit), " paragraf (tüm kitapta)"),
    el("span", { class: "cip" }, "Yazım tespiti: ", el("b", {}, VERI.toplam_yazim ?? 0), " (gösterilen sayfalarda)"),
    VERI.tutarlilik_var ? el("span", { class: "cip" }, "Bilgi tutarsızlığı: ", el("b", {}, VERI.toplam_tutarlilik), " (gösterilen sayfalara dokunan)")
                        : el("span", { class: "cip", title: "Önce tutarlılık kriteri çalıştırılmalı (yerel modeller)" }, "Bilgi tutarsızlığı: çalıştırılmadı"),
  );
}

// Müfredat notları kitabın bütünü içindir (sayfaya bağlı değil): üst şeritte, tıklayınca açılan panelde
function mufredatCipi(kutu) {
  const m = VERI.mufredat;
  if (m === null || m === undefined) {
    kutu.append(el("span", { class: "cip", title: "Müfredat kriteri bu kitap için çalıştırılmadı ya da kitaba uyan program yok" },
      "Müfredat: çalıştırılmadı"));
    return;
  }
  if (!m.length) { kutu.append(el("span", { class: "cip" }, "Müfredat: ", el("b", {}, "bütün anahtar kavramlar var"))); return; }
  const panel = el("div", { id: "mufredatPanel", hidden: true },
    el("b", {}, "Öğretim programıyla karşılaştırma"), " — kitabın bütünü için; sayfalara işaretlenmez.",
    el("ul", {}, m.map(n => el("li", {}, n.tur === "kavram_yok" ? el("span", { class: "kavram" }, n.parca + ": ") : null, n.aciklama))));
  document.querySelector("header").after(panel);
  const dugme = el("button", { class: "cip", "aria-expanded": "false", title: "Notları göster / gizle" },
    "Müfredat: ", el("b", {}, `${m.length} not`), " ▾");
  dugme.onclick = () => { panel.hidden = !panel.hidden; dugme.setAttribute("aria-expanded", String(!panel.hidden)); };
  kutu.append(dugme);
}

// --- sol panel ---
function lejant() {
  const kutu = document.getElementById("lejant");
  for (const [tur, t] of Object.entries(TURLER)) {
    const kutucuk = el("input", { type: "checkbox" });
    kutucuk.checked = true;
    kutucuk.addEventListener("change", () => { durum.gorunur[tur] = kutucuk.checked; sayfaCiz(); });
    kutu.append(el("label", {}, kutucuk, el("span", { class: "kare", style: `background:${t.renk}` }), t.ad));
  }
  kutu.append(el("label", { style: "cursor:default" }, el("span", { style: "width:13px" }),
    el("span", { class: "kare", style: "border:2px dashed var(--tespit)" }), "Okunabilirlik tespiti"));
  kutu.append(el("label", { style: "cursor:default" }, el("span", { style: "width:13px" }),
    el("span", { class: "kare", style: "border-bottom:3px solid var(--bozuk);border-radius:0" }), "Yazım tespiti"));
  if (VERI.tutarlilik_var) kutu.append(el("label", { style: "cursor:default" }, el("span", { style: "width:13px" }),
    el("span", { class: "kare", style: "background:#f3dcf7;border:1.5px dashed var(--celiski)" }), "Bilgi tutarsızlığı"));
}
const gosterilenYazim = b => (b.yazim || []).filter(y => y.guven >= 0.5);
const yazimSayisi = s => s.bloklar.reduce((n, b) => n + gosterilenYazim(b).length, 0);
const celiskiler = b => (b.tutarlilik || []).filter(k => k.guven);
const celiskiSayisi = s => s.bloklar.reduce((n, b) => n + celiskiler(b).length, 0);
function sayfaListesi() {
  const kutu = document.getElementById("sayfaListesi");
  kutu.replaceChildren();
  const yalniz = document.getElementById("yalnizTespitli").checked;
  VERI.sayfalar.forEach((s, i) => {
    const tespit = s.bloklar.filter(b => b.tespit).length, yz = yazimSayisi(s), cs = celiskiSayisi(s);
    if (yalniz && !tespit && !yz && !cs) return;
    kutu.append(el("button", { class: i === durum.sayfa ? "secili" : "", onclick: () => sayfayaGit(i) },
      el("span", {}, `s. ${s.no}`, s.basili && s.basili !== String(s.no) ? el("span", { class: "kucuk" }, ` (kitap ${s.basili})`) : null),
      el("span", { class: "rozetler" },
        tespit ? el("span", { class: "rozet", title: "okunabilirlik tespiti" }, tespit) : null,
        yz ? el("span", { class: "rozet yazim", title: "yazım tespiti" }, yz) : null,
        cs ? el("span", { class: "rozet celiski", title: "bilgi tutarsızlığı" }, cs) : null)));
  });
}

// --- sayfa çizimi ---
function sayfaCiz() {
  const s = sayfa(), kutu = document.getElementById("sayfaKutusu");
  document.getElementById("sayfaBilgisi").textContent =
    `PDF s. ${s.no} / kitap s. ${s.basili ?? "–"}  (${durum.sayfa + 1} / ${VERI.sayfalar.length})`;
  const k = svg("svg", { id: "sayfa", viewBox: `0 0 ${s.genislik} ${s.yukseklik}` });
  k.style.width = `${Math.round(durum.olcek * 100)}%`;
  k.style.maxWidth = durum.olcek === 1 ? "760px" : "none";
  if (durum.blok !== null) k.classList.add("soluk");
  k.append(svg("image", { href: s.goruntu, width: s.genislik, height: s.yukseklik }));
  k.addEventListener("click", e => { if (e.target === k || e.target.tagName === "image") blokSec(null); });

  const tum = document.getElementById("tumCumleler").checked;
  s.bloklar.forEach((b, i) => {
    if (!(tum || i === durum.blok)) return;
    b.cumle_kutulari.forEach((kutular, ci) => kutular.forEach(([x0, y0, x1, y1]) => {
      k.append(svg("rect", { class: "cumleKutu", "data-cumle": `${i}-${ci}`, x: x0, y: y0,
        width: x1 - x0, height: y1 - y0, fill: CUMLE_RENK[ci % 2], rx: 1.5 }));
    }));
  });
  // Küçük bloklar büyüklerin üstünde kalsın diye büyükten küçüğe çizilir
  const sira = s.bloklar.map((b, i) => i).sort((a, c) => alan(s.bloklar[c]) - alan(s.bloklar[a]));
  for (const i of sira) {
    const b = s.bloklar[i], [x0, y0, x1, y1] = b.bbox, renk = TURLER[b.rapor.tur].renk;
    if (!durum.gorunur[b.rapor.tur] && i !== durum.blok) continue;
    const r = svg("rect", { class: "blok" + (i === durum.blok ? " secili" : ""), x: x0 - 2, y: y0 - 2,
      width: x1 - x0 + 4, height: y1 - y0 + 4, rx: 3, fill: renk, stroke: renk });
    r.append(svg("title"));
    r.firstChild.textContent = `Blok ${b.rapor.blok_no} · ${TURLER[b.rapor.tur].ad}`;
    r.addEventListener("click", e => { e.stopPropagation(); blokSec(i); });
    k.append(r);
    if (b.tespit) k.append(svg("rect", { class: "tespitCerceve", x: x0 - 6, y: y0 - 6,
      width: x1 - x0 + 12, height: y1 - y0 + 12, rx: 5 }));
  }
  // Yazım tespitleri: hatalı kelimenin altı kırmızı çizilir (blok türü gizli olsa bile)
  // Seçili bloğun yazım izi: tanınmayan / atlanan kelimeler durum rengiyle çerçevelenir
  const iz = durum.blok !== null && durum.sekme === "yazim" ? s.bloklar[durum.blok].yazim_izi : null;
  if (iz) iz.kelimeler.forEach((w, wi) => (w.kutular || []).forEach(([x0, y0, x1, y1]) => {
    k.append(svg("rect", { class: "kelimeIz", "data-kelime": wi, x: x0 - 1.5, y: y0 - 1, width: x1 - x0 + 3,
      height: y1 - y0 + 2, rx: 2, stroke: YK[w.d].cizgi, fill: YK[w.d].cizgi }));
  }));
  // Yazım tespitleri: hatalı kelimenin altı kırmızı çizilir (blok türü gizli olsa bile);
  // tıklanınca o kelimenin yazım denetimi açılır
  s.bloklar.forEach((b, bi) => (b.yazim || []).forEach(y => y.kutular.forEach(([x0, y0, x1, y1]) => {
    const zemin = svg("rect", { class: "yazimZemin tiklanir", x: x0 - 1, y: y0, width: x1 - x0 + 2, height: y1 - y0, rx: 1.5 });
    zemin.append(svg("title"));
    zemin.firstChild.textContent = `Yazım: ${y.parca} (tıklayın)`;
    zemin.addEventListener("click", e => { e.stopPropagation(); durum.sekme = "yazim"; blokSec(bi, y.parca); });
    k.append(zemin);
    k.append(svg("rect", { class: "yazimCizgi", x: x0 - 1, y: y1 - 0.4, width: x1 - x0 + 2,
      height: 1.6, opacity: y.guven >= 1 ? 1 : y.guven >= 0.5 ? 0.55 : 0.2 }));
  })));
  // Bilgi tutarsızlığı: çelişen cümle mor kesikli kutuyla; tıklanınca karşılaştırma açılır
  s.bloklar.forEach((b, bi) => celiskiler(b).forEach((c, ci) => (c.kutular || []).forEach(([x0, y0, x1, y1]) => {
    const r = svg("rect", { class: "celiskiKutu", "data-celiski": `${bi}-${ci}`, x: x0 - 2, y: y0 - 1.5,
      width: x1 - x0 + 4, height: y1 - y0 + 3, rx: 2 });
    r.append(svg("title"));
    r.firstChild.textContent = `Bilgi tutarsızlığı: s. ${c.karsi.basili ?? c.karsi.sayfa_no} ile (tıklayın)`;
    r.addEventListener("click", e => { e.stopPropagation(); durum.sekme = "tutarlilik"; blokSec(bi); });
    k.append(r);
  })));
  kutu.replaceChildren(k);
  document.getElementById("olcek").textContent = `${Math.round(durum.olcek * 100)}%`;
  blokListesi();
}
const alan = b => (b.bbox[2] - b.bbox[0]) * (b.bbox[3] - b.bbox[1]);

function blokListesi() {
  const kutu = document.getElementById("blokListesi");
  kutu.replaceChildren(...sayfa().bloklar.map((b, i) => el("div",
    { class: i === durum.blok ? "secili" : "", onclick: () => blokSec(i) },
    el("span", { class: "kare", style: `background:${TURLER[b.rapor.tur].renk}` }),
    el("b", {}, `b${b.rapor.blok_no}`),
    b.tespit ? el("span", { class: "rozet" }, "!") : null,
    gosterilenYazim(b).length ? el("span", { class: "rozet yazim" }, gosterilenYazim(b).length) : null,
    celiskiler(b).length ? el("span", { class: "rozet celiski" }, celiskiler(b).length) : null,
    el("span", { class: "m" }, b.rapor.metin))));
}

// --- seçim ve ayrıntı paneli ---
function blokSec(i, odakParca = null) {
  durum.blok = i;
  sayfaCiz();
  ayrinti();
  document.getElementById("sag").scrollTop = 0;  // ayrıntılar baştan okunsun
  if (odakParca) {  // sayfadaki kırmızı çizgiden gelindi: o kelimeyi göster
    const iz = sayfa().bloklar[i].yazim_izi;
    const wi = iz ? iz.kelimeler.findIndex(w => w.d !== "gecerli" && odakParca.includes(w.k)) : -1;
    if (wi >= 0) kelimeGoster(wi, true);
  }
}

  (b.yazim || []).forEach(y => parcalar.push(el("div", { class: "kart yazimKart" + (y.guven < 0.5 ? " dusuk" : "") },

      : y.aciklama.includes("Terim:")

function cumleParlat(anahtar, acik) {
  document.querySelectorAll(`[data-cumle="${anahtar}"]`).forEach(e => e.classList.toggle("parlak", acik));
}

function hesapPaneli(s) {
  const h = s.hesap, o = VERI.ozet, out = [el("h2", {}, "Okunabilirlik hesabı (adım adım)")];
  if (!s.tespit_adayi) out.push(el("div", { class: "kart kucuk" },
    `${VERI.min_cumle} cümleden az olduğu için bu paragraf tespit adayı değil: tek cümlede formüller kararsız sonuç verir. Puanlar yalnızca bilgi amaçlıdır (kitap özetine katılır).`));
  out.push(
    el("div", { class: "adim" }, `Kelime / cümle = ${h.kelime} ÷ ${h.cumle} = ${sayi(h.kelime_cumle, 2)}`),
    el("div", { class: "adim" }, `Hece / kelime  = ${h.hece} ÷ ${h.kelime} = ${sayi(h.hece_kelime, 2)}`));
  const hk = sayi(h.hece_kelime, 2), kc = sayi(h.kelime_cumle, 2);
  out.push(formulKarti("Ateşman (1997)", s.atesman, o?.atesman, 0, 120, false,
      `198,825 − 40,175 × ${hk} − 2,610 × ${kc}`, "Yüksek puan = kolay. 90+ çok kolay · 70–89 kolay · 50–69 orta · 30–49 zor · <30 çok zor"),
    formulKarti("Çetinkaya-Uzun (2010)", s.cetinkaya_uzun, o?.cetinkaya_uzun, 0, 100, false,
      `118,823 − 25,987 × ${hk} − 0,971 × ${kc}`, "Yüksek puan = kolay. 51+ → 5–7. sınıf · 35–50 → 8–9. sınıf · <35 → 10–12. sınıf"),
    formulKarti("Bezirci-Yılmaz (2010)", s.bezirci_yilmaz, o?.bezirci_yilmaz, 0, 30, true,
      `√( ${kc} × (${sayi(h.h["3"], 2)}×0,84 + ${sayi(h.h["4"], 2)}×1,5 + ${sayi(h.h["5"], 2)}×3,5 + ${sayi(h.h["6"], 2)}×26,25) )`,
      "Yüksek değer = zor (≈ sınıf düzeyi). H3…H6: cümle başına 3, 4, 5, 6+ heceli kelime sayısı"));
  return out;
}

function formulKarti(ad, [deger, duzey], ortanca, min, max, yuksekZor, acilim, not) {
  const yuzde = v => Math.max(0, Math.min(100, (v - min) / (max - min) * 100));
  const cubuk = el("div", { class: "cubuk" + (yuksekZor ? " ters" : "") },
    el("span", { class: "isaret", style: `left:calc(${yuzde(deger)}% - 2px)`, title: "bu paragraf" }));
  if (ortanca != null) cubuk.append(el("span", { class: "ortanca", style: `left:calc(${yuzde(ortanca)}% - 1px)`, title: "kitap ortancası" }));
  return el("div", { class: "kart formul" },
    el("b", {}, ad), el("span", { class: "deger" }, sayi(deger)),
    el("span", {}, duzey), el("span", { class: "kucuk" }, ortanca != null ? `kitap ortancası ${sayi(ortanca)}` : ""),
    cubuk,
    el("div", { class: "adim", style: "grid-column:1/-1" }, `= ${acilim} ≈ ${sayi(deger)}`),
    el("div", { class: "kucuk", style: "grid-column:1/-1" }, not));
}

    el("div", { class: "ykLejant" }, Object.entries(YK).filter(([d]) => say[d]).map(([d, y]) =>
      el("span", { class: "yk " + d }, `${y.ad}: ${say[d]}`))),
    el("div", { class: "kelimeler" }, iz.kelimeler.map((w, wi) => el("span", {
      class: "yk " + w.d, "data-wi": wi, tabindex: 0,
      onmouseenter: () => kelimeGoster(wi), onfocus: () => kelimeGoster(wi), onclick: () => kelimeGoster(wi),
    }, w.k))),
    el("div", { id: "kelimeBilgi", class: "ipucu" }, "Bir kelimenin üzerine gelince iki aracın kararı ve sistemin son kararı burada görünür; kelime sayfada da çerçevelenir.")));

  // 3. TDK kuralları
  const kisa = b.rapor.tur !== "paragraf" || iz.durum === "aralikli";
  out.push(el("div", { class: "kart" }, adim("3", "TDK kuralları denetlendi"),
    el("table", { class: "kurallar" }, KURALLAR.map(([kod, tur, ad, yalnizParagraf]) => {
      const n = iz.kurallar[tur] || 0;
      return el("tr", {}, el("td", {}, kod), el("td", {}, ad), el("td", {},
        n ? el("span", { class: "olumsuz" }, `✗ ${n} tespit`)
          : yalnizParagraf && kisa ? el("span", { class: "kucuk" }, "kısa metinde yok")
          : el("span", { class: "tamam" }, "✓ temiz")));
    })),
    el("div", { class: "kucuk", style: "margin-top:6px" }, "R3–R5 yalnız paragraflarda çalışır: başlık ve harita etiketlerinde (\"KIY DA\") sahte hata üretiyordu.")));

  // Sonuç: bu blokta raporlanan tespitler
  out.push(el("h2", {}, "Sonuç"), b.yazim.length
    ? el("div", { class: "kucuk" }, `Bu blokta ${b.yazim.length} yazım tespiti raporlandı (yukarıdaki kırmızı kartlar).`)
    : el("div", { class: "kart" }, el("span", { class: "tamam" }, "✓ Bu blokta yazım hatası bulunmadı.")));
  return out;
}

// --- bilgi tutarlılığı (adım adım) ---
const KARAR_AD = { celiski: "çelişki", uyumlu: "uyumlu", ilgisiz: "ilgisiz", "?": "cevap yok" };
const sayfaSirasi = no => VERI.sayfalar.findIndex(s => s.no === no);
const sy = (no, basili) => `s. ${basili ?? no}`;
// Test modunda bu cümle kitaba bizim eklediğimiz/değiştirdiğimiz ifade mi?
const eklendiMi = m => (VERI.test_modu?.eklenenler || []).some(e => m.includes(e) || (m.length >= 25 && e.includes(m)));
const eklendiEtiketi = m => eklendiMi(m) ? el("span", { class: "eklendi" }, "test için eklendi") : null;

function karsiyaGit(k) {  // çelişkinin diğer tarafına geç: sayfayı aç, bloğu seç, tutarlılık sekmesi
  const i = sayfaSirasi(k.karsi.sayfa_no);
  if (i < 0) return;
  sayfayaGit(i);
  const bi = sayfa().bloklar.findIndex(b => b.rapor.blok_no === k.karsi.blok_no);
  durum.sekme = "tutarlilik";
  if (bi >= 0) blokSec(bi);
}

function oySatiri(ad, oy) {
  if (!oy) return [];
  return [el("span", {}, ad), el("span", { class: "etiket " + (oy.karar === "celiski" ? "celiski" : oy.karar) }, KARAR_AD[oy.karar] ?? oy.karar),
          oy.aciklama ? el("span", { class: "gerekce" }, oy.aciklama) : null].filter(Boolean);
}

function celiskiKarti(b, k) {
  const ikisi = k.ikinci?.karar === "celiski";
  const varMi = sayfaSirasi(k.karsi.sayfa_no) >= 0;
  return el("div", { class: "kart celiskiKart" },
    el("b", {}, `⇄ Olası bilgi tutarsızlığı (güven ${sayi(k.guven, 1)})`),
    el("div", { class: "ikiCumle" },
      el("div", { class: "alinti" }, el("div", { class: "kucuk" }, el("span", {}, `Bu blok · ${sy(sayfa().no, sayfa().basili)}`), eklendiEtiketi(k.ben)), k.ben),
      el("div", { class: "alinti" }, el("div", { class: "kucuk" }, el("span", {}, sy(k.karsi.sayfa_no, k.karsi.basili)),
        eklendiEtiketi(k.karsi.metin),
        varMi ? el("button", { onclick: () => karsiyaGit(k) }, "O sayfaya git →")
              : el("span", {}, "(bu incelemeye alınmamış sayfa)")), k.karsi.metin)),
    el("div", { class: "adimBaslik" }, el("span", { class: "adimNo" }, "1"), "Neden karşılaştırıldı?"),
    el("div", { class: "kucuk" }, `İki cümle anlamca benzer bulundu (bge-m3 benzerliği ${sayi(k.benzerlik, 2)}). Sistem her cümleyi yalnız kendisine en benzer 3 cümleyle karşılaştırır; böylece tüm kitabı her şeyle karşılaştırmak gerekmez.`),
    el("div", { class: "adimBaslik", style: "margin-top:8px" }, el("span", { class: "adimNo" }, "2"), "Hızlı ön eleme"),
    el("div", { class: "oy" }, ...oySatiri("gemma4", { karar: k.hizli })),
    el("div", { class: "adimBaslik", style: "margin-top:8px" }, el("span", { class: "adimNo" }, "3"), "İki model gerekçeli karar verdi (cümlelerin geçtiği yerle birlikte)"),
    el("div", { class: "oy" }, ...oySatiri("gemma4 (hakem)", k.hakem), ...oySatiri("Turkish-Gemma (ikinci görüş)", k.ikinci)),
    el("div", { style: "margin-top:6px" }, "→ ", ikisi
      ? "İki model de çelişki dedi: güven 1,0."
      : "Yalnız gemma4 çelişki dedi: güven 0,5 — bir insanın bakması gerekir."),
    el("div", { class: "kucuk", style: "margin-top:6px" }, "Not: Sistem hangi cümlenin doğru olduğuna karar vermez; yalnız iki ifadenin birlikte doğru olamayacağını söyler."));
}

function tutarlilikPaneli(b) {
  const tumu = b.tutarlilik, tespit = tumu.filter(k => k.guven), diger = tumu.filter(k => !k.guven);
  const out = [el("div", { class: "kart kucuk" },
    "Bilgi tutarlılığı, bu bloğun bilgi cümlelerini kitabın geri kalanında anlamca en yakın cümlelerle karşılaştırır. ",
    "Önce gemma4 hızlıca \"çelişki mi?\" diye bakar; şüphelileri gemma4 ve Turkish-Gemma cümlelerin geçtiği yeri de görerek gerekçeli değerlendirir. ",
    "Turkish-Gemma tek başına tespit üretemez; yalnız güveni artırır.")];
  tespit.forEach(k => out.push(celiskiKarti(b, k)));
  if (!tumu.length) {
    out.push(el("div", { class: "kart" }, "Bu bloğun cümleleri için yeterince benzer bir cümle bulunmadı (aday yok) ya da blokta bilgi cümlesi yok (soru, yönerge, kısa cümle, karakter konuşması)."));
    return out;
  }
  if (!tespit.length) out.push(el("div", { class: "kart" }, el("span", { class: "tamam" }, "✓ Bu blokta bilgi tutarsızlığı bulunmadı.")));
  if (diger.length) {
    out.push(el("h2", {}, `Karşılaştırılan diğer cümleler (${diger.length})`),
      el("div", { class: "kucuk" }, "Soldaki sayı anlam benzerliği (0–1). Sağdaki etiket kararı gösterir; \"elendi\": hızlı turda şüphelenildi ama gerekçeli değerlendirmede çelişki görülmedi."));
    diger.forEach(k => {
      const elendi = k.hizli === "celiski";
      const satir = el("div", { class: "karsi" },
        el("span", { class: "bz" }, sayi(k.benzerlik, 2)),
        el("div", {}, el("div", { class: "kucuk" }, `Bu blok: ${k.ben.slice(0, 90)}${k.ben.length > 90 ? "…" : ""}`),
          el("div", {}, `${sy(k.karsi.sayfa_no, k.karsi.basili)}: ${k.karsi.metin}`),
          elendi && k.hakem?.aciklama ? el("div", { class: "kucuk", style: "margin-top:3px" }, "gemma4: ", k.hakem.aciklama) : null),
        el("span", { class: "etiket " + (elendi ? "elendi" : k.hizli) }, elendi ? "elendi" : KARAR_AD[k.hizli] ?? k.hizli));
      out.push(satir);
    });
  }
  return out;
}

function kelimeGoster(wi, kaydir = false) {
  const iz = sayfa().bloklar[durum.blok].yazim_izi, w = iz.kelimeler[wi], E = VERI.yazim_esikleri;
  document.querySelectorAll(".yk.odak").forEach(e => e.classList.remove("odak"));
  const cip = document.querySelector(`.yk[data-wi="${wi}"]`);
  if (cip) { cip.classList.add("odak"); if (kaydir) cip.scrollIntoView({ block: "center", behavior: "smooth" }); }
  document.querySelectorAll(".kelimeIz.parlak").forEach(e => e.classList.remove("parlak"));
  document.querySelectorAll(`.kelimeIz[data-kelime="${wi}"]`).forEach(e => e.classList.add("parlak"));
  const kitapta = w.kitapta != null ? ` Kitapta ${w.kitapta} kez geçiyor.` : "";
  const sonuc = {
    gecerli: "İki araç da çözümleyebildi → doğru yazılmış kabul edildi.",
    hata: `İki araç da çözümleyemedi ve hiçbir sahte hata önlemine uymadı → YAZIM HATASI (güven 1,0).${kitapta} Terim sayılması için en az ${E.terim} kez geçmeliydi.`,
    supheli: `Araçlardan yalnız biri çözümleyemedi → şüpheli, düşük güvenle raporlandı (güven 0,5).${kitapta}`,
    atlandi: `En az bir araç tanımadı ama sahte hata önlemiyle atlandı: ${w.not}.`,
    terim: `En az bir araç tanımadı ama kitapta sık geçiyor ("${w.not}" en az ${E.terim} kez) → araçların bilmediği, kitaba özel bir terim sayıldı.${kitapta}`,
    okuma: "En az bir araç tanımadı ama bu blokta ya da sayfada PDF okuma sorunu (düşmüş harf) var → kitabın hatası sayılmadı.",
  }[w.d];
  const bilgi = document.getElementById("kelimeBilgi");
  bilgi.classList.remove("ipucu");
  bilgi.replaceChildren(
    el("div", {}, el("b", { style: "font-size:15px" }, w.k), "  ", el("span", { class: "yk " + w.d }, YK[w.d].ad)),
    el("div", { class: "olcum", style: "margin:4px 0" },
      el("span", {}, "Starlang (ana denetçi)"), karar(w.st),
      el("span", {}, "Zemberek (ikinci görüş)"), karar(w.zb)),
    el("div", {}, "→ ", sonuc));
}

// --- gezinme ---
function sayfayaGit(i) {
  if (i < 0 || i >= VERI.sayfalar.length) return;
  durum.sayfa = i; durum.blok = null;
  sayfaCiz(); ayrinti(); sayfaListesi();
}
document.getElementById("onceki").onclick = () => sayfayaGit(durum.sayfa - 1);
document.getElementById("sonraki").onclick = () => sayfayaGit(durum.sayfa + 1);
document.getElementById("buyut").onclick = () => { durum.olcek = Math.min(3, durum.olcek + 0.25); sayfaCiz(); };
document.getElementById("kucult").onclick = () => { durum.olcek = Math.max(0.5, durum.olcek - 0.25); sayfaCiz(); };
document.getElementById("tumCumleler").onchange = sayfaCiz;
document.getElementById("yalnizTespitli").onchange = sayfaListesi;
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") sayfayaGit(durum.sayfa + 1);
  else if (e.key === "ArrowLeft") sayfayaGit(durum.sayfa - 1);
  else if (e.key === "Escape") blokSec(null);
});

// Arayüzün sonuç ekranındaki bağlantılar: inceleme.html#s=45&b=3&k=yazim&p=kelime → PDF'in 45. sayfası
// açılır; b verilirse o blok seçili gelir (k: sağ paneldeki sekme, p: hatalı parça) ve renkli blok
// kutuları kapanır: editör yalnız işaretli yeri görsün.
function adrestekiSayfa() {
  const p = new URLSearchParams(location.hash.slice(1));
  const i = p.get("s") ? sayfaSirasi(Number(p.get("s"))) : -1;
  if (i < 0) return;
  sayfayaGit(i);
  if (!p.has("b")) return;
  for (const tur of Object.keys(durum.gorunur)) durum.gorunur[tur] = false;
  document.querySelectorAll("#lejant input[type=checkbox]").forEach(k => { k.checked = false; });
  const bi = sayfa().bloklar.findIndex(x => x.rapor.blok_no === Number(p.get("b")));
  if (bi < 0) { sayfaCiz(); return; }
  if (["yazim", "tutarlilik", "okunabilirlik"].includes(p.get("k"))) durum.sekme = p.get("k");
  blokSec(bi, p.get("p") || null);
}
window.addEventListener("hashchange", adrestekiSayfa);

ustBilgi(); lejant(); sayfaListesi(); sayfaCiz(); ayrinti();
adrestekiSayfa();
</script>
</body>
